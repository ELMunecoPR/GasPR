    margin-top: 5px;
}

.combustibles small {

    color: #666;
}

<h2>Gasolineras cerca de ti</h2>
<div id="gasolineras"></div>
    <h2>Precios por marca</h2>
    <div id="marcas"></div>
  </div>

  <script>
 fetch("/api/precios")
      .then(respuesta => respuesta.json())
      .then(datos => {

        document.getElementById("regular").textContent =
          `Regular: ${datos.regular.minimo} - ${datos.regular.maximo} ¢/L`;

        document.getElementById("premium").textContent =
          `Premium: ${datos.premium.minimo} - ${datos.premium.maximo} ¢/L`;

        document.getElementById("diesel").textContent =
          `Diesel: ${datos.diesel.minimo} - ${datos.diesel.maximo} ¢/L`;

        document.getElementById("fecha").textContent =
          `Actualizado: ${new Date(datos.actualizado).toLocaleString()}`;
          const contenedorMarcas = document.getElementById("marcas");

contenedorMarcas.innerHTML = datos.marcas
  .map(marca => `
   <div class="marca">
  <strong>${marca.marca}</strong>

  <div class="combustibles">
    <div>
      <span>Regular</span>
      <b>${marca.regular}</b>
      <small>¢/L</small>
    </div>

    <div>
      <span>Premium</span>
      <b>${marca.premium}</b>
      <small>¢/L</small>
    </div>

    <div>
      <span>Diesel</span>
      <b>${marca.diesel}</b>
      <small>¢/L</small>
    </div>
  </div>
</div>
  `)
  .join("");
      });
      let gasolinerasActuales = [];
     async function cargarGasolineras() {
        const municipioSeleccionado = document.getElementById("municipio").value;

  if (!municipioSeleccionado) {
    return;
  }
  const municipio = document.getElementById("municipio").value;
  const respuesta = await fetch(`/api/gasolineras?municipio=${municipio}`);
  const gasolineras = await respuesta.json();
  gasolinerasActuales = gasolineras;
  
  const contenedor = document.getElementById("gasolineras");
  contenedor.innerHTML = gasolineras
  .map(estacion => `
  <div class="marca">
    <strong>${estacion.attributes.Name}</strong><br>
    ${estacion.attributes.City}<br>
    <a href="https://www.google.com/maps?q=${estacion.attributes.GPS_Latitu},${estacion.attributes.GPS_Longit}" target="_blank"class="boton-mapa">
      Ver en mapa
    </a>
  </div>
`)
  .join("");
}
function calcularDistancia(lat1, lon1, lat2, lon2) {
  const R = 3958.8;
  const rad = grados => grados * Math.PI / 180;

  const dLat = rad(lat2 - lat1);
  const dLon = rad(lon2 - lon1);

  const a =
    Math.sin(dLat / 2) ** 2 +
    Math.cos(rad(lat1)) *
    Math.cos(rad(lat2)) *
    Math.sin(dLon / 2) ** 2;

  return 2 * R * Math.asin(Math.sqrt(a));
}
cargarGasolineras();
document.getElementById("municipio").addEventListener("change", cargarGasolineras);
document.getElementById("cercaDeMi").addEventListener("click", () => {
  navigator.geolocation.getCurrentPosition(async posicion => {
    const latitudUsuario = posicion.coords.latitude;
    const longitudUsuario = posicion.coords.longitude;
    const municipioSelect = document.getElementById("municipio");
municipioSelect.value = "";

    const respuesta = await fetch("/api/gasolineras?todas=1");
gasolinerasActuales = await respuesta.json();

gasolinerasActuales = gasolinerasActuales
  .map(estacion => {
    estacion.distancia = calcularDistancia(
      latitudUsuario,
      longitudUsuario,
      estacion.attributes.GPS_Latitu,
      estacion.attributes.GPS_Longit
    );

    return estacion;
  })
  .sort((a, b) => a.distancia - b.distancia);
  gasolinerasActuales = gasolinerasActuales.slice(0, 10);
  if (gasolinerasActuales.length > 0) {
  municipioSelect.value = gasolinerasActuales[0].attributes.City;
}
  const contenedor = document.getElementById("gasolineras");
  contenedor.innerHTML = gasolinerasActuales
  .map((estacion, index) => `
    <div class="marca ${index === 0 ? "mas-cercana" : ""}">
      ${index === 0 ? '<div class="etiqueta-cercana">Más cercana</div>' : ''}
      <strong>${estacion.attributes.Name}</strong><br>
      ${estacion.distancia.toFixed(2)} millas<br>
      <a href="https://www.google.com/maps/dir/?api=1&origin=${latitudUsuario}%2C${longitudUsuario}&destination=${estacion.attributes.GPS_Latitu}%2C${estacion.attributes.GPS_Longit}&travelmode=driving" target="_blank">
        Cómo llegar
      </a>
    </div>
  `)
  .join("");
  },
error => {
  alert("No pudimos obtener tu ubicación. Verifica que tengas la ubicación activada y dale permiso a GasPR.");
});
});
