<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GasPR</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f4f4f4;
      text-align: center;
      padding: 40px;
    }

    .card {
      background: white;
      max-width: 400px;
      margin: auto;
      padding: 25px;
      border-radius: 16px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.15);
    }

    h1 {
      margin-bottom: 25px;
    }

    .precio {
      font-size: 24px;
      margin: 18px 0;
    }

    .fecha {
      margin-top: 25px;
      font-size: 14px;
      color: #666;
    }
#marcas {
    margin-top: 20px;
}

.marca {
    padding: 15px;
    margin-bottom: 12px;
    border: 1px solid #ddd;
    border-radius: 10px;
}
.combustibles {
    display: flex;
    justify-content: space-between;
    margin-top: 15px;
}
.combustibles > div {
    flex: 1;
    display: flex;
    flex-direction: column;
}
.combustibles b {
    font-size: 20px;
    margin-top: 5px;
}

.combustibles small {
    font-size: 12px;
    color: #666;
}
  </style>
</head>

<body>

  <div class="card">
    <h1>GasPR</h1>

    <div class="precio" id="regular">Regular: cargando...</div>
    <div class="precio" id="premium">Premium: cargando...</div>
    <div class="precio" id="diesel">Diesel: cargando...</div>

    <div class="fecha" id="fecha"></div>
    <select id="municipio">
  <option value="AGUADILLA">Aguadilla</option>
  <option value="MAYAGUEZ">Mayagüez</option>
  <option value="RINCON">Rincón</option>
</select>
<button id="cercaDeMi">Cerca de mí</button>
<h2>Gasolineras</h2>
<div id="gasolineras"></div>
    <h2>Precios por marca</h2>
    <div id="marcas"></div>
  </div>

  <script>
 fetch("/api/precios")
      .then(respuesta => respuesta.json())
      .then(datos => {

        document.getElementById("regular").textContent =
          `Regular: ${datos.regular.minimo} - ${datos.regular.maximo} ¢/L`;

        document.getElementById("premium").textContent =
          `Premium: ${datos.premium.minimo} - ${datos.premium.maximo} ¢/L`;

        document.getElementById("diesel").textContent =
          `Diesel: ${datos.diesel.minimo} - ${datos.diesel.maximo} ¢/L`;

        document.getElementById("fecha").textContent =
          `Actualizado: ${new Date(datos.actualizado).toLocaleString()}`;
          const contenedorMarcas = document.getElementById("marcas");

contenedorMarcas.innerHTML = datos.marcas
  .map(marca => `
   <div class="marca">
  <strong>${marca.marca}</strong>

  <div class="combustibles">
    <div>
      <span>Regular</span>
      <b>${marca.regular}</b>
      <small>¢/L</small>
    </div>

    <div>
      <span>Premium</span>
      <b>${marca.premium}</b>
      <small>¢/L</small>
    </div>

    <div>
      <span>Diesel</span>
      <b>${marca.diesel}</b>
      <small>¢/L</small>
    </div>
  </div>
</div>
  `)
  .join("");
      });
      let gasolinerasActuales = [];
     async function cargarGasolineras() {
  const municipio = document.getElementById("municipio").value;
  const respuesta = await fetch(`/api/gasolineras?municipio=${municipio}`);
  const gasolineras = await respuesta.json();
  gasolinerasActuales = gasolineras;
  console.log(gasolineras);
  const contenedor = document.getElementById("gasolineras");
  contenedor.innerHTML = gasolineras
  .map(estacion => `
  <div class="marca">
    <strong>${estacion.attributes.Name}</strong><br>
    ${estacion.attributes.City}<br>
    <a href="https://www.google.com/maps?q=${estacion.attributes.GPS_Latitu},${estacion.attributes.GPS_Longit}" target="_blank">
      Ver en mapa
    </a>
  </div>
`)
  .join("");
}
function calcularDistancia(lat1, lon1, lat2, lon2) {
  const R = 3958.8;
  const rad = grados => grados * Math.PI / 180;

  const dLat = rad(lat2 - lat1);
  const dLon = rad(lon2 - lon1);

  const a =
    Math.sin(dLat / 2) ** 2 +
    Math.cos(rad(lat1)) *
    Math.cos(rad(lat2)) *
    Math.sin(dLon / 2) ** 2;

  return 2 * R * Math.asin(Math.sqrt(a));
}
cargarGasolineras();
document.getElementById("municipio").addEventListener("change", cargarGasolineras);
document.getElementById("cercaDeMi").addEventListener("click", () => {
  navigator.geolocation.getCurrentPosition(async posicion => {
    const latitudUsuario = posicion.coords.latitude;
    const longitudUsuario = posicion.coords.longitude;

    const respuesta = await fetch("/api/gasolineras?todas=1");
gasolinerasActuales = await respuesta.json();

gasolinerasActuales = gasolinerasActuales
  .map(estacion => {
    estacion.distancia = calcularDistancia(
      latitudUsuario,
      longitudUsuario,
      estacion.attributes.GPS_Latitu,
      estacion.attributes.GPS_Longit
    );

    return estacion;
  })
  .sort((a, b) => a.distancia - b.distancia);
  const contenedor = document.getElementById("gasolineras");
  contenedor.innerHTML = gasolinerasActuales
  .map(estacion => `
    <div class="marca">
      <strong>${estacion.attributes.Name}</strong><br>
      ${estacion.distancia.toFixed(2)} millas<br>
      <a href="https://www.google.com/maps?q=${estacion.attributes.GPS_Latitu},${estacion.attributes.GPS_Longit}" target="_blank">
        Ver en mapa
      </a>
    </div>
  `)
  .join("");
  });
});

  </script>

</body>
</html>
