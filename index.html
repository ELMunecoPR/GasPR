<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GasPR</title>

  <style>
body {
    font-family: Arial, sans-serif;
    margin: 0;
    padding: 0;
    min-height: 100vh;
    text-align: center;
    background-color: #dff3fd;
    overflow-x: hidden;
    position: relative;
    isolation: isolate;
}

body::before {
    content: "";
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100vh;
    height: 100dvh;
    background-image:
        linear-gradient(180deg, rgba(239, 250, 255, 0.14) 0%, rgba(239, 250, 255, 0.3) 100%),
        url("images/gaspr_tropical_background.png");
    background-repeat: no-repeat;
    background-size: cover;
    background-position: center top;
    pointer-events: none;
    z-index: -1;
}

@media (max-width: 600px) {
    body::before {
        background-position: 62% top;
    }
}

.card {
    width: 100%;
    max-width: 460px;
    min-height: 100vh;
    margin: 0 auto;
    padding: 24px 18px 48px;
    box-sizing: border-box;
    background: transparent;
    box-shadow: none;
    font-family: Arial, sans-serif;
}

.app-header {
    margin-bottom: 18px;
    padding-top: 6px;
}

.app-header h1 {
    margin: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: clamp(46px, 13vw, 56px);
    font-weight: 900;
    line-height: 1;
    letter-spacing: -2.5px;
    color: #111;
    position: relative;
    isolation: isolate;
}

.app-logo-icon {
    width: 0.64em;
    height: 0.64em;
    margin-left: 10px;
    color: #111;
    flex-shrink: 0;
    fill: currentColor;
    order: 2;
    transform: translateY(0.02em);
    position: relative;
    z-index: 1;
}

.app-header h1::after {
    content: "PR";
    color: #0d6efd;
    order: 1;
    position: relative;
    z-index: 1;
}

.app-header h1 > span {
    order: 0;
    position: relative;
    z-index: 1;
}

.app-header p {
    margin: 7px 0 0;
    color: #263746;
    font-size: 16px;
    font-weight: 600;
    line-height: 1.3;
}

.fuel-buttons {
    display: flex;
    gap: 9px;
    margin: 14px 0 20px;
}

.fuel-button {
    flex: 1;
    min-width: 0;
    min-height: 152px;
    border: 3px solid #111;
    border-radius: 21px 21px 14px 14px;
    padding: 12px 6px 10px;
    cursor: pointer;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: space-between;
    font-family: "Arial Narrow", "Roboto Condensed", "Helvetica Neue Condensed", Arial, sans-serif;

    box-shadow:
        0 7px 0 #111,
        0 11px 16px rgba(0, 0, 0, 0.18);

    transition:
        transform 0.12s ease,
        box-shadow 0.12s ease;
}
.fuel-button:active {
    transform: translateY(4px);

    box-shadow:
        0 3px 0 #111,
        0 6px 10px rgba(0, 0, 0, 0.16);
}

.fuel-button:focus-visible {
    outline: 3px solid rgba(13, 110, 253, 0.4);
    outline-offset: 3px;
}


.octane-rating {
    font-size: 8px;
    font-weight: 900;
    line-height: 0.95;
    letter-spacing: -0.2px;
    text-transform: uppercase;
}

.octane-method {
    margin-top: -5px;
    font-size: 6px;
    font-weight: 900;
    line-height: 1;
    letter-spacing: -0.15px;
    text-transform: uppercase;
}

.fuel-button strong {
    font-size: clamp(42px, 12vw, 54px);
    line-height: 1;
    font-weight: 900;
}

.fuel-button em {
    font-style: normal;
    font-size: 11px;
    font-weight: 900;
    letter-spacing: 4px;
    margin-top: -2px;
}

.fuel-button span {
    font-size: 13px;
    font-weight: 900;
    letter-spacing: 0.25px;
    transform: scaleX(0.94);
}

.fuel-button.regular {
    background: #ffd83d;
    color: #111;
}

.fuel-button.premium {
    background: #ef233c;
    color: white;
}

.fuel-button.diesel {
    background: #27c76f;
    color: #111;
}

.fecha {
    margin-top: 23px;
    color: #526372;
    font-size: 12px;
    font-weight: 600;
}

.controles {
    display: flex;
    flex-direction: column;
    gap: 11px;
    margin: 16px 0 10px;
}

.controles select {
    width: 100%;
    min-height: 52px;
    padding: 0 42px 0 15px;
    color: #243442;
    font-size: 15px;
    font-weight: 600;
    border: 1px solid #ccd8e2;
    border-radius: 14px;
    background-color: rgba(255, 255, 255, 0.96);
    background-image:
        linear-gradient(45deg, transparent 50%, #526372 50%),
        linear-gradient(135deg, #526372 50%, transparent 50%);
    background-position:
        calc(100% - 19px) 22px,
        calc(100% - 14px) 22px;
    background-size: 5px 5px, 5px 5px;
    background-repeat: no-repeat;
    box-sizing: border-box;
    box-shadow: 0 3px 10px rgba(35, 74, 105, 0.08);
    appearance: none;
}

.controles select:focus-visible {
    outline: 3px solid rgba(13, 110, 253, 0.25);
    border-color: #0d6efd;
}

#cercaDeMi {
    width: 100%;
    min-height: 54px;
    padding: 13px 18px;
    font-size: 17px;
    font-weight: 800;
    border: none;
    border-radius: 15px;
    background: linear-gradient(180deg, #1685ff 0%, #0d6efd 100%);
    color: white;
    cursor: pointer;
    box-shadow: 0 6px 14px rgba(13, 110, 253, 0.28);
    transition: transform 0.15s ease, box-shadow 0.15s ease;
}

#cercaDeMi:hover {
    box-shadow: 0 8px 18px rgba(13, 110, 253, 0.34);
}

#cercaDeMi:active {
    transform: translateY(2px);
    box-shadow: 0 3px 9px rgba(13, 110, 253, 0.25);
}

#cercaDeMi:focus-visible {
    outline: 3px solid rgba(13, 110, 253, 0.3);
    outline-offset: 3px;
}

.boton-mapa {
    display: inline-block;
    min-height: 38px;
    margin-top: 8px;
    padding: 9px 13px;
    color: #fff;
    background: #0d6efd;
    box-sizing: border-box;
    text-decoration: none;
    font-size: 12px;
    font-weight: 700;
    border-radius: 9px;
}

#marcas {
    margin-top: 12px;
}

.card > h2 {
    margin: 30px 0 7px;
    color: #172733;
    font-size: 20px;
    line-height: 1.25;
    letter-spacing: -0.25px;
}

#contadorGasolineras {
    margin: 0 0 8px;
    color: #526372;
    font-size: 12px;
    font-weight: 600;
}

#contadorGasolineras:empty {
    display: none;
}

#gasolineras + h2 {
    margin-top: 16px;
}
.marca.mas-cercana {
    border: 2px solid #007aff;
    background: #f0f7ff;
}

.etiqueta-cercana {
    display: inline-block;
    margin-bottom: 7px;
    padding: 4px 9px;
    color: white;
    background: #007aff;
    border-radius: 20px;
    font-size: 11px;
    font-weight: 700;
}

.gasolinera-cercana {
    margin-bottom: 8px;
    padding: 11px 13px;
    text-align: left;
    background: rgba(255, 255, 255, 0.96);
    border: 1px solid #e1e7ef;
    border-radius: 13px;
    box-shadow: 0 3px 10px rgba(35, 74, 105, 0.07);
}

#gasolineras {
    max-height: min(440px, 55vh);
    max-height: min(440px, 55dvh);
    overflow-y: auto;
    overscroll-behavior: contain;
    -webkit-overflow-scrolling: touch;
    scrollbar-gutter: stable;
    scrollbar-width: thin;
    scrollbar-color: rgba(95, 103, 114, 0.35) transparent;
    padding-right: 4px;
}

#gasolineras::-webkit-scrollbar {
    width: 6px;
}

#gasolineras::-webkit-scrollbar-track {
    background: transparent;
}

#gasolineras::-webkit-scrollbar-thumb {
    background: rgba(95, 103, 114, 0.35);
    border-radius: 999px;
}

#gasolineras::-webkit-scrollbar-thumb:hover {
    background: rgba(95, 103, 114, 0.55);
}

.gasolinera-cercana.mas-cercana {
    border: 2px solid #0d6efd;
    background: #f4f8ff;
    box-shadow: 0 4px 12px rgba(13, 110, 253, 0.12);
}

.gasolinera-cercana .etiqueta-cercana {
    margin-bottom: 7px;
    padding: 4px 9px;
    font-size: 11px;
}

.gasolinera-nombre {
    display: block;
    color: #111;
    font-size: 15px;
    line-height: 1.25;
}

.gasolinera-distancia {
    display: block;
    margin-top: 4px;
    font-size: 12px;
    font-weight: 700;
    color: #0d6efd;
}

.gasolinera-como-llegar {
    display: inline-block;
    min-height: 38px;
    margin-top: 7px;
    padding: 9px 12px;
    color: white;
    background: #0d6efd;
    border-radius: 9px;
    box-sizing: border-box;
    font-size: 12px;
    font-weight: 700;
    text-decoration: none;
}

.gasolinera-como-llegar:focus-visible {
    outline: 3px solid rgba(13, 110, 253, 0.35);
    outline-offset: 2px;
}

.marca {
    margin-bottom: 8px;
    padding: 13px 14px;
    background: rgba(255, 255, 255, 0.96);
    border: 1px solid #e1e7ef;
    border-radius: 13px;
    box-shadow: 0 3px 10px rgba(35, 74, 105, 0.07);
}
.combustibles {
    display: flex;
    justify-content: space-between;
    margin-top: 15px;
}
.combustibles > div {
    flex: 1;
    display: flex;
    flex-direction: column;
}
.combustibles b {
    font-size: 20px;
    margin-top: 5px;
}

.combustibles small {
    font-size: 12px;
    color: #666;
}
.fuel-popup {
    position: fixed;
    inset: 0;
    background: rgba(0, 0, 0, 0.45);
    display: none;
    align-items: center;
    justify-content: center;
    padding: 20px;
    box-sizing: border-box;
    z-index: 9999;
}

.fuel-popup.activo {
    display: flex;
}

.fuel-popup-content {
    width: 100%;
    max-width: 340px;
    background: white;
    border-radius: 24px;
    padding: 26px 22px 22px;
    box-sizing: border-box;
    box-shadow: 0 15px 40px rgba(0,0,0,0.25);
    position: relative;
}

.cerrar-popup {
    position: absolute;
    top: 10px;
    right: 14px;
    border: none;
    background: transparent;
    font-size: 32px;
    line-height: 1;
    cursor: pointer;
}

.fuel-popup-content h2 {
    margin: 4px 0 22px;
    font-size: 28px;
}

.popup-precios {
    display: flex;
    gap: 12px;
}

.popup-precios > div {
    flex: 1;
    background: #f4f6f8;
    border-radius: 16px;
    padding: 16px 10px;
    display: flex;
    flex-direction: column;
    gap: 5px;
}

.popup-precios span {
    font-size: 14px;
    color: #666;
}

.popup-precios strong {
    font-size: 28px;
}

.popup-precios small {
    color: #666;
}

.fuel-popup-content p {
    margin: 18px 0 0;
    font-size: 13px;
    color: #666;
}
.popup-regular {
    border-top: 12px solid #ffd83d;
}

.popup-premium {
    border-top: 12px solid #ef233c;
}

.popup-diesel {
    border-top: 12px solid #27c76f;
}

.popup-regular #popupTitulo {
    color: #111;
}

.popup-premium #popupTitulo {
    color: #ef233c;
}

.popup-diesel #popupTitulo {
    color: #159957;
}
.marca-fila {
    width: 100%;
    min-height: 92px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 6px;
    padding: 12px 28px 10px 10px;
    color: #111;
    font-family: Arial, sans-serif;
    text-align: center;
    background: rgba(255, 255, 255, 0.95);
    border: 1px solid #e1e7ef;
    border-radius: 14px;
    box-shadow: 0 3px 10px rgba(35, 74, 105, 0.07);
    cursor: pointer;
    position: relative;
    transition: transform 0.15s ease, box-shadow 0.15s ease;
}

.marca-fila::after {
    content: "›";
    position: absolute;
    top: 50%;
    right: 10px;
    color: #7b8b98;
    font-size: 24px;
    font-weight: 400;
    line-height: 1;
    transform: translateY(-50%);
}

.marca-fila:hover {
    transform: translateY(-2px);
    border-color: #c8d8e5;
    box-shadow: 0 6px 16px rgba(35, 74, 105, 0.12);
}

.marca-fila:focus-visible {
    outline: 3px solid rgba(13, 110, 253, 0.35);
    outline-offset: 2px;
}

#marcas {
    display: grid;
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 9px;
}

.marca-logo {
    width: 100%;
    max-width: 112px;
    height: 48px;
    object-fit: contain;
}

.marca-accion {
    font-size: 10px;
    font-weight: 700;
    color: #667085;
}

@media (max-width: 380px) {
    .card {
        padding: 20px 12px 42px;
    }

    .fuel-buttons {
        gap: 6px;
    }

    .fuel-button {
        min-height: 144px;
        padding-inline: 4px;
        border-radius: 18px 18px 12px 12px;
    }

    .octane-rating {
        font-size: 7px;
    }

    .octane-method {
        font-size: 5.5px;
    }

    .fuel-button strong {
        font-size: 42px;
    }

    .fuel-button em {
        font-size: 9px;
        letter-spacing: 2px;
    }

    .fuel-button span {
        font-size: 11px;
    }

    .card > h2 {
        font-size: 19px;
    }
}

@media (min-width: 700px) {
    .card {
        padding-top: 32px;
    }

}

.price-sign {
    --sign-background: #f8fafc;
    --sign-accent: #243b53;
    --sign-secondary: #0d6efd;
    --sign-panel: white;
    --sign-text: #111;
    --sign-price: #0d6efd;
    width: 100%;
    max-width: 300px;
    max-height: 86vh;
    max-height: 86dvh;
    padding: 20px 16px 16px;
    overflow-y: auto;
    color: var(--sign-text);
    background: var(--sign-background);
    border: 5px solid var(--sign-accent);
    border-top: 12px solid var(--sign-secondary);
    border-radius: 18px;
    box-sizing: border-box;
    box-shadow: 0 18px 45px rgba(0, 0, 0, 0.28);
    position: relative;
    overscroll-behavior: contain;
    -webkit-overflow-scrolling: touch;
}

.price-sign--shell {
    --sign-background: linear-gradient(180deg, #fff 0%, #fffdf5 100%);
    --sign-accent: #dd1d21;
    --sign-secondary: #ffd500;
    --sign-panel: #faf7ee;
    --sign-text: #24272a;
    --sign-price: #ff3438;
    border: 5px solid #d4d8da;
    border-top: 12px solid #ffd500;
    border-radius: 12px;
    box-shadow:
        0 18px 45px rgba(0, 0, 0, 0.28),
        inset 0 0 0 2px #fff;
}

.price-sign--shell .price-sign-header {
    min-height: 126px;
    padding: 8px 38px 12px;
    background: #fff;
    border-bottom: 5px solid #dd1d21;
    box-shadow: 0 4px 0 #ffd500;
}

.price-sign--shell .price-sign-logo {
    width: 108px;
    height: 86px;
    filter: drop-shadow(0 3px 2px rgba(0, 0, 0, 0.16));
}

.price-sign--shell .price-sign-title {
    color: #c81820;
    font-size: 14px;
    letter-spacing: 0.12em;
}

.price-sign--shell .cerrar-popup {
    color: #292d30;
}

.price-sign--shell .price-sign-prices {
    gap: 6px;
    margin-top: 13px;
}

.price-sign--shell .price-sign-prices::after {
    content: "V-POWER";
    padding: 7px 10px;
    color: #fff;
    background: linear-gradient(90deg, #c91820 0%, #ed2d32 70%, #ffd500 70%);
    border-radius: 3px;
    font-size: 12px;
    font-weight: 900;
    font-style: italic;
    letter-spacing: 0.12em;
    text-align: left;
}

.price-sign--shell .price-sign-row {
    min-height: 56px;
    gap: 8px;
    padding: 6px 7px 6px 11px;
    background: #f5f3ec;
    border: 1px solid #d8dcde;
    border-left: 5px solid #dd1d21;
    border-radius: 3px;
}

.price-sign--shell .price-sign-label {
    color: #a71920;
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.04em;
}

.price-sign--shell .price-sign-row > span:last-child {
    min-width: 120px;
    padding: 7px 8px;
    color: #ff3438;
    text-align: right;
    background: #201d1d;
    border: 2px inset #716969;
    box-sizing: border-box;
}

.price-sign--shell .price-sign-value {
    color: #ff3438;
    font-family: "Courier New", monospace;
    font-size: 30px;
    letter-spacing: 1px;
    text-shadow: 0 0 8px rgba(255, 52, 56, 0.58);
}

.price-sign--shell .price-sign-source {
    color: #4b4f52;
    opacity: 1;
}

.price-sign--shell .price-sign-stations {
    color: #fff;
    background: #d71920;
    border: 0;
    border-bottom: 4px solid #ffd500;
    border-radius: 5px;
}

.price-sign--sunoco {
    --sign-background: linear-gradient(180deg, #f8f9fa 0%, #e2e6e8 100%);
    --sign-accent: #073f9f;
    --sign-secondary: #ffd21a;
    --sign-panel: #b51635;
    --sign-text: #17243a;
    --sign-price: #ff573d;
    border: 6px solid #b7c0c4;
    border-top-color: #e5e9ea;
    border-radius: 7px;
    box-shadow:
        0 18px 45px rgba(0, 0, 0, 0.31),
        inset 0 0 0 2px #fff;
}

.price-sign--sunoco .price-sign-header {
    min-height: 132px;
    padding: 10px 14px 0;
    background: #073f9f;
    border: 2px solid #d8dfe2;
}

.price-sign--sunoco .price-sign-header::after {
    content: "";
    width: calc(100% + 28px);
    height: 12px;
    margin-top: 8px;
    background: linear-gradient(90deg, #ffd21a 0 72%, #d51f32 72% 100%);
    border-top: 3px solid #fff;
    box-sizing: border-box;
}

.price-sign--sunoco .price-sign-logo {
    max-width: 190px;
    height: 72px;
    filter: drop-shadow(0 3px 2px rgba(0, 0, 0, 0.28));
}

.price-sign--sunoco .price-sign-title {
    color: #ffd21a;
    font-size: 13px;
    font-style: italic;
    letter-spacing: 0.15em;
}

.price-sign--sunoco .cerrar-popup {
    color: #fff;
}

.price-sign--sunoco .price-sign-prices {
    gap: 0;
    margin-top: 8px;
    border: 3px solid #aeb8bd;
}

.price-sign--sunoco .price-sign-row {
    min-height: 58px;
    gap: 0;
    padding: 0;
    overflow: hidden;
    background: #151b20;
    border: 0;
    border-bottom: 3px solid #d5dcdf;
    border-radius: 0;
}

.price-sign--sunoco .price-sign-row:last-child {
    border-bottom: 0;
}

.price-sign--sunoco .price-sign-label {
    width: 96px;
    align-self: stretch;
    display: flex;
    align-items: center;
    padding: 9px 10px;
    color: #fff;
    background: #b51635;
    box-sizing: border-box;
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.03em;
}

.price-sign--sunoco .price-sign-row:last-child .price-sign-label {
    color: #ffd21a;
}

.price-sign--sunoco .price-sign-row > span:last-child {
    flex: 1;
    padding: 7px 10px;
    color: #ff573d;
    text-align: right;
}

.price-sign--sunoco .price-sign-value {
    color: #ff573d;
    font-family: "Courier New", monospace;
    font-size: 30px;
    letter-spacing: 1px;
    text-shadow: 0 0 8px rgba(255, 87, 61, 0.58);
}

.price-sign--sunoco .price-sign-row:last-child > span:last-child,
.price-sign--sunoco .price-sign-row:last-child .price-sign-value {
    color: #48e685;
    text-shadow: 0 0 8px rgba(72, 230, 133, 0.5);
}

.price-sign--sunoco .price-sign-source {
    color: #34424c;
    opacity: 1;
}

.price-sign--sunoco .price-sign-stations {
    color: #fff;
    background: #073f9f;
    border: 0;
    border-bottom: 4px solid #ffd21a;
    border-radius: 4px;
}

.price-sign--texaco {
    --sign-background: linear-gradient(180deg, #fafafa 0%, #e3e5e6 100%);
    --sign-accent: #d71920;
    --sign-secondary: #202224;
    --sign-panel: #242627;
    --sign-text: #202224;
    --sign-price: #ff3d42;
    border: 6px solid #8f9699;
    border-top-color: #d8dcde;
    border-radius: 7px;
    box-shadow:
        0 18px 45px rgba(0, 0, 0, 0.34),
        inset 0 0 0 2px #fff;
}

.price-sign--texaco .price-sign-header {
    min-height: 132px;
    padding: 8px 38px 12px;
    background: #fff;
    border: 2px solid #b6bdc0;
    border-bottom: 10px solid #d71920;
}

.price-sign--texaco .price-sign-logo {
    width: 112px;
    height: 94px;
    filter: drop-shadow(0 3px 2px rgba(0, 0, 0, 0.2));

      Ver en mapa
    </a>
  </div>
`)
  .join("");
}
function calcularDistancia(lat1, lon1, lat2, lon2) {
  const R = 3958.8;
  const rad = grados => grados * Math.PI / 180;

  const dLat = rad(lat2 - lat1);
  const dLon = rad(lon2 - lon1);

  const a =
    Math.sin(dLat / 2) ** 2 +
    Math.cos(rad(lat1)) *
    Math.cos(rad(lat2)) *
    Math.sin(dLon / 2) ** 2;

  return 2 * R * Math.asin(Math.sqrt(a));
}
